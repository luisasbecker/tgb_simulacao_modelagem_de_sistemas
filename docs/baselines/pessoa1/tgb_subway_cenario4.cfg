# ============================================================================
#  TGB - Simulacao e Modelagem de Sistemas - UNISINOS  -  Prof. Alex Roehrs
#  Fila do Subway da Unisinos  |  CENARIO 4 (2 no balcao, 2 caixas)
#  Gabriela Bley Rodrigues  |  Luisa Becker dos Santos
#
#  FLUXO:
#    ChegadaClientes -> FilaBalcao -> Balcao1 / Balcao2   (2 atendentes, fila unica)
#      -> RotaTostagem --(1: P=0,55)--> FilaTostagem -> Tostadeira --.
#                       \--(2: P=0,45)---------------------------------+--> FilaCaixa
#      -> Caixa1 / Caixa2   (2 caixas, fila unica)
#      -> EstatSistema -> Saida
#
#  DIFERENCA PARA O CENARIO 1:
#    Adiciona Caixa2 na mesma FilaCaixa (fila unica, 2 servidores em paralelo).
#    Pergunta: um segundo caixa reduz o lead time W em relacao ao cenario 1?
#
#  Indicadores no .rep:  Wq = AverageQueueTime ; Lq = QueueLengthAverage ;
#  rho = Utilisation (media dos servidores) ; W = EstatSistema.SampleAverage.
# ============================================================================

RecordEdits

Define SimEntity                { Cliente }
Define EntityGenerator          { ChegadaClientes }
Define Queue                    { FilaBalcao  FilaTostagem  FilaCaixa }
Define Server                   { Balcao1  Balcao2  Tostadeira  Caixa1  Caixa2 }
Define Branch                   { RotaTostagem }
Define Statistics               { EstatSistema }
Define EntitySink               { Saida }
Define ExponentialDistribution  { ChegadaDist }
Define TriangularDistribution   { MontagemDist  TostaDist  PagamentoDist }
Define DiscreteDistribution     { RotaDist }

Define ColladaModel   { Axis  Grid100x100 }
Define DisplayEntity  { XY-Grid }
Define OverlayClock   { Relogio }
Define OverlayText    { Titulo }
Define View           { View1 }

# ---- unidades ----------------------------------------------------------
ChegadaDist    UnitType { TimeUnit }
MontagemDist   UnitType { TimeUnit }
TostaDist      UnitType { TimeUnit }
PagamentoDist  UnitType { TimeUnit }
RotaDist       UnitType { DimensionlessUnit }
EstatSistema   UnitType { TimeUnit }

# ==========================  DISTRIBUICOES  ===========================
# Chegadas ~ Poisson  ->  intervalos  EXPO(90 s)
ChegadaDist   RandomSeed { 1 }
ChegadaDist   Mean       { 90 s }

# Montagem do lanche no balcao  ~  TRIA(60; 105; 200) s
MontagemDist  RandomSeed { 2 }
MontagemDist  MinValue   { 60 s }
MontagemDist  Mode       { 105 s }
MontagemDist  MaxValue   { 200 s }

# Tostagem (pao na esteira/forno)  ~  TRIA(20; 30; 45) s
TostaDist     RandomSeed { 3 }
TostaDist     MinValue   { 20 s }
TostaDist     Mode       { 30 s }
TostaDist     MaxValue   { 45 s }

# Pagamento no caixa  ~  TRIA(18; 38; 95) s
PagamentoDist RandomSeed { 4 }
PagamentoDist MinValue   { 18 s }
PagamentoDist Mode       { 38 s }
PagamentoDist MaxValue   { 95 s }

# Decisao de rota: 1 = tostar (P=0,55) ; 2 = segue direto (P=0,45)
RotaDist      RandomSeed      { 5 }
RotaDist      ValueList       { 1  2 }
RotaDist      ProbabilityList { 0.55  0.45 }

# ==========================  FLUXO  ===================================
ChegadaClientes NextComponent    { FilaBalcao }
ChegadaClientes InterArrivalTime { ChegadaDist }
ChegadaClientes PrototypeEntity  { Cliente }
ChegadaClientes BaseName         { Cliente }
ChegadaClientes MaxNumber        { 999 }

Balcao1 WaitQueue     { FilaBalcao }
Balcao1 ServiceTime   { MontagemDist }
Balcao1 NextComponent { RotaTostagem }

Balcao2 WaitQueue     { FilaBalcao }
Balcao2 ServiceTime   { MontagemDist }
Balcao2 NextComponent { RotaTostagem }

# 1 -> FilaTostagem (tostar) ; 2 -> FilaCaixa (segue direto)
RotaTostagem NextComponentList { FilaTostagem  FilaCaixa }
RotaTostagem Choice            { RotaDist }

Tostadeira WaitQueue     { FilaTostagem }
Tostadeira ServiceTime   { TostaDist }
Tostadeira NextComponent { FilaCaixa }

# Dois caixas em paralelo, fila unica
Caixa1 WaitQueue     { FilaCaixa }
Caixa1 ServiceTime   { PagamentoDist }
Caixa1 NextComponent { EstatSistema }

Caixa2 WaitQueue     { FilaCaixa }
Caixa2 ServiceTime   { PagamentoDist }
Caixa2 NextComponent { EstatSistema }

# tempo total no sistema (chegada -> saida), por entidade  (W)
EstatSistema NextComponent { Saida }
EstatSistema SampleValue   { 'this.obj.TotalTime' }

# ==========================  EXECUCAO  ================================
# Janela de pico da noite (18h-19h30 = 90 min). Sistema comeca vazio (analise
# terminal), sem periodo de aquecimento.
# RunDuration = 2.5 h: chegadas param em 90 min (EndTime do gerador),
# os 60 min restantes permitem que todos os clientes concluam o atendimento.
# NumberOfReplications = 30 (requisito minimo do GB).
Simulation Description               { 'Fila do Subway da Unisinos - Cenario 4 (2 balcao, 2 caixas)' }
Simulation RunDuration               { 2.5 h }
Simulation InitializationDuration    { 0 h }
Simulation NumberOfReplications      { 30 }
Simulation PrintReport               { TRUE }
Simulation PrintReplications         { TRUE }
Simulation PrintConfidenceIntervals  { TRUE }

# Colunas do .dat (1 linha por replicacao); o .rep traz media + IC 95%:
#  1 Wq  - espera media na fila do balcao (s)
#  2 Lq  - fila media do balcao
#  3       fila maxima do balcao
#  4 Wq  - espera media na fila do caixa (s)   <- reduz com 2 caixas
#  5 rho - utilizacao do balcao (media dos 2 servidores)
#  6 rho - utilizacao do caixa (media dos 2 servidores)
#  7 rho - utilizacao da tostadeira
#  8 W   - tempo medio no sistema (s)           <- INDICADOR PRINCIPAL
#  9       clientes atendidos
Simulation RunOutputList {
  { '[FilaBalcao].AverageQueueTime/1[s]' }
  { '[FilaBalcao].QueueLengthAverage' }
  { '[FilaBalcao].QueueLengthMaximum' }
  { '[FilaCaixa].AverageQueueTime/1[s]' }
  { '([Balcao1].Utilisation + [Balcao2].Utilisation)/2' }
  { '([Caixa1].Utilisation + [Caixa2].Utilisation)/2' }
  { '[Tostadeira].Utilisation' }
  { '[EstatSistema].SampleAverage/1[s]' }
  { '[Saida].NumberAdded' }
}

# ==============================  GRAFICOS  ===========================
Simulation RealTime           { FALSE }
Simulation RealTimeFactor     { 32 }
Simulation ShowLabels         { TRUE }
Simulation ShowModelBuilder   { TRUE }
Simulation ShowObjectSelector { TRUE }
Simulation ShowInputEditor    { TRUE }
Simulation ShowOutputViewer   { TRUE }
Simulation DisplayedUnits     { s }

Cliente          Position { -8    0.5  0  m }
ChegadaClientes  Position { -6    0.5  0  m }
FilaBalcao       Position { -3    0.5  0  m }
Balcao1          Position { -1    1.2  0  m }
Balcao2          Position { -1   -0.2  0  m }
RotaTostagem     Position {  1    0.5  0  m }
FilaTostagem     Position {  2.5  1.6  0  m }
Tostadeira       Position {  4    1.6  0  m }
FilaCaixa        Position {  4    0.5  0  m }
Caixa1           Position {  6    1.2  0  m }
Caixa2           Position {  6   -0.2  0  m }
EstatSistema     Position {  8    0.5  0  m }
Saida            Position { 10    0.5  0  m }
ChegadaDist      Position { -6   -1.6  0  m }
MontagemDist     Position { -1   -1.6  0  m }
TostaDist        Position {  4    3.0  0  m }
PagamentoDist    Position {  6   -1.6  0  m }
RotaDist         Position {  1   -1.6  0  m }

Axis         ColladaFile { <res>/shapes/axis_text.dae }
Grid100x100  ColladaFile { <res>/shapes/grid100x100.dae }
XY-Grid      Size { 100 100 m }
XY-Grid      DisplayModel { Grid100x100 }
XY-Grid      Show { FALSE }
XY-Grid      Movable { FALSE }

Relogio ScreenPosition { 15 15 }
Relogio AlignBottom { TRUE }
Relogio TextHeight { 10 }
Relogio FontColour { gray20 }
Relogio FontStyle { ITALIC }
Relogio DateFormat { 'yyyy-MMM-dd HH:mm:ss' }

Titulo ScreenPosition { 15 15 }
Titulo Format { 'Fila do Subway da Unisinos  -  Cenario 4 (2 no balcao, 2 caixas)' }
Titulo TextHeight { 18 }
Titulo FontColour { 30 60 90 }
Titulo FontStyle { BOLD }

View1 ViewCenter   { 2  0  0  m }
View1 ViewPosition { 2  -3  20  m }
View1 ShowWindow   { TRUE }
View1 Lock2D       { TRUE }
View1 SkyboxImage  { <res>/images/sky_map_2048x1024.jpg }
