# ============================================================================
#  TGA - Simulacao e Modelagem de Sistemas - UNISINOS  -  Prof. Alex Roehrs
#  Fila do Subway da Unisinos  |  CENARIO 3 (aumento da demanda por tostados)
#  Gabriela Bley Rodrigues  |  Luisa Becker dos Santos
#
#  Objetos das Aulas 04-05: SimEntity, EntityGenerator, pares Queue + Server,
#  Branch + DiscreteDistribution, Statistics, EntitySink.
#  Abrir no JaamSim (File > Open).  Experimento: Simulation > NumberOfReplications
#  + PrintReport -> gera o relatorio .rep ao lado deste arquivo.
#  Demonstracao com animacao: botao Play (>).
#
#  FLUXO (ver ACD do relatorio):
#    ChegadaClientes -> FilaBalcao -> Balcao1 / Balcao2   (2 atendentes, fila unica)
#      -> RotaTostagem --(1: P=0,55)--> FilaTostagem -> Tostadeira --.
#                       \--(2: P=0,45)---------------------------------+--> FilaCaixa
#      -> Caixa -> EstatSistema -> Saida
#
#  Dois estagios em serie (balcao e caixa) + uma decisao de rota (tostar?).
#  Indicadores no .rep:  Wq = AverageQueueTime ; Lq = QueueLengthAverage ;
#  rho = Utilisation (por Server) ; W = EstatSistema.SampleAverage.
#
#  PARAMETROS: valores de projeto (aba "Fontes" da planilha; dados sinteticos,
#  uso autorizado pelo professor). Para dados reais, troque apenas o bloco
#  DISTRIBUICOES pelos valores da aba "Resumo".
#
#  DIFERENCA PARA O CENARIO 1: RotaDist ProbabilityList  0.55/0.45 -> 0.75/0.25
#  (proporcao de pedidos tostados sobe de 55% para 75%). Resto identico
#  (2 no balcao, 1 caixa).
# ============================================================================

